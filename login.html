<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Sign In · Citizen Service Tracker</title>
<link rel="stylesheet" href="css/style.css" />
</head>
<body>
<div class="login-wrap">
  <div class="card card-pad login-card">
    <h2>Sign In</h2>
    <p class="text-dim mt-0">Citizen Service Tracker</p>
    <form id="loginForm">
      <div class="field">
        <label>Email</label>
        <input type="email" id="email" autocomplete="username" required />
      </div>
      <div class="field">
        <label>Password</label>
        <input type="password" id="password" autocomplete="current-password" required />
      </div>
      <div id="loginError" class="text-danger hidden" style="margin-bottom:10px; font-size:13px;"></div>
      <button type="submit" class="btn btn-primary w-full" id="btnSubmit">Sign In</button>
    </form>
  </div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
<script src="js/firebase-config.js"></script>
<script src="js/auth-gate.js"></script>
<script src="js/login-page.js"></script>
</body>
</html>
