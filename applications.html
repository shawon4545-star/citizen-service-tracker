<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Applications · Citizen Service Tracker</title>
<link rel="stylesheet" href="css/style.css" />
<link rel="manifest" href="manifest.json" />
<meta name="theme-color" content="#2f6feb" />
<link rel="icon" href="icons/icon-192.png" />
<link rel="apple-touch-icon" href="icons/icon-192.png" />
</head>
<body>
<div class="app-shell" id="app-shell">
  <div class="main">
    <div class="topbar" id="topbar-root"></div>

    <div class="content">
      <div class="filters-bar">
        <div class="field">
          <label>Service Type</label>
          <select id="filterService"><option value="">All</option></select>
        </div>
        <div class="field">
          <label>Status</label>
          <select id="filterStatus"><option value="">All</option></select>
        </div>
        <div class="field grow">
          <label>Search</label>
          <input type="text" id="filterSearch" placeholder="Search client, reference..." />
        </div>
        <div class="field">
          <label>&nbsp;</label>
          <button class="btn" id="filterReset">✕ Reset</button>
        </div>
      </div>

      <div class="card">
        <div class="card-header">
          <h2>All Applications</h2>
          <div class="flex gap-8">
            <span class="text-dim" id="recordCount" style="font-size:12px;"></span>
            <button class="btn btn-sm" id="btnExportExcel">▤ Export Excel</button>
          </div>
        </div>
        <div class="table-wrap">
          <table id="dataTable">
            <thead>
              <tr><th>Client</th><th>Service</th><th>Reference</th><th>Status</th><th>Fee</th><th>Due Date</th><th>Urgency</th><th></th></tr>
            </thead>
            <tbody id="tableBody"></tbody>
            <tfoot id="tableFoot"></tfoot>
          </table>
        </div>
        <div id="emptyState" class="empty-state hidden">
          <div class="icon">📄</div>
          <div><strong>No applications yet</strong></div>
          <div class="text-faint">Open a client and add their first application.</div>
        </div>
      </div>
    </div>

    <footer class="page-footer">Citizen Service Tracker</footer>
  </div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
<script src="js/firebase-config.js"></script>
<script src="js/auth-gate.js"></script>
<script>
  AppAuth.requireAuthThenLoad(['js/db.js', 'js/export.js', 'js/drive-sync.js', 'js/nav.js', 'js/applications.js']);
</script>
<script>
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => navigator.serviceWorker.register('sw.js'));
  }
</script>
</body>
</html>
